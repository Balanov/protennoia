<text x="122.00" y="61.20" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.6" fill="#5b6472" text-anchor="start" font-weight="normal">points of degradation.</text>
<text x="122.00" y="68.60" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.6" fill="#5b6472" text-anchor="start" font-weight="normal"></text>
