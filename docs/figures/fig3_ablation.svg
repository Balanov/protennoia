<text x="122.00" y="83.40" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.6" fill="#5b6472" text-anchor="start" font-weight="normal">families disagree radically on the</text>
<text x="122.00" y="90.80" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.6" fill="#5b6472" text-anchor="start" font-weight="normal">same model — so a single-family</text>
<text x="122.00" y="98.20" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.6" fill="#5b6472" text-anchor="start" font-weight="normal">index reports its own protocol.</text>
<text x="6.00" y="84.00" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.4" fill="#16181d" text-anchor="start" font-weight="normal">Reported per system: R, Δc and κ under BOTH ablation families; disagreement is reported as a finding.</text>
