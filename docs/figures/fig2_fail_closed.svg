<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="170.0" height="78.0" viewBox="0 0 170.0 78.0" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif">
<title>Fail-closed evaluation gate</title>
<text x="6.00" y="10.00" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="9.5" fill="#16181d" text-anchor="start" font-weight="bold">Figure 2. Fail-closed evaluation gate.</text>
<text x="6.00" y="16.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="8" fill="#5b6472" text-anchor="start" font-weight="normal">A profile is emitted only if every control fails in the specified direction. A metric that cannot fail is a defect, not a success.</text>
<rect x="6.00" y="24.00" width="32.00" height="34.00" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1.0" opacity="1.0"/>
<text x="10.00" y="31.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.8" fill="#16181d" text-anchor="start" font-weight="bold">1. Run controls</text>
<text x="10.00" y="39.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">random policy</text>
<text x="10.00" y="47.70" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">lookup table</text>
<text x="10.00" y="55.90" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">independent latents</text>
<text x="10.00" y="64.10" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">fixed-response system</text>
<text x="10.00" y="72.30" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">mock calibrated confidence</text>
<line x1="39.00" y1="41.00" x2="47.00" y2="41.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="47.00" y1="41.00" x2="43.54" y2="43.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="47.00" y1="41.00" x2="43.54" y2="39.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<rect x="48.00" y="24.00" width="30.00" height="34.00" rx="3" fill="#fdf0e6" stroke="#a4591b" stroke-width="1.0" opacity="1.0"/>
<text x="52.00" y="31.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.8" fill="#a4591b" text-anchor="start" font-weight="bold">2. Gate</text>
<text x="52.00" y="39.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">control must fall</text>
<text x="52.00" y="47.70" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">as specified</text>
<text x="52.00" y="55.90" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal"></text>
<text x="52.00" y="64.10" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">else: NO PROFILE</text>
<line x1="79.00" y1="41.00" x2="87.00" y2="41.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="87.00" y1="41.00" x2="83.54" y2="43.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="87.00" y1="41.00" x2="83.54" y2="39.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<rect x="88.00" y="24.00" width="34.00" height="34.00" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1.0" opacity="1.0"/>
<text x="92.00" y="31.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.8" fill="#16181d" text-anchor="start" font-weight="bold">3. Run subject</text>
<text x="92.00" y="39.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">seeded, deterministic</text>
<text x="92.00" y="47.70" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">5 seeds x 3 reps</text>
<text x="92.00" y="55.90" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">bootstrap 95% CI</text>
<text x="92.00" y="64.10" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">per-metric uncertainty</text>
<line x1="123.00" y1="41.00" x2="131.00" y2="41.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="131.00" y1="41.00" x2="127.54" y2="43.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<line x1="131.00" y1="41.00" x2="127.54" y2="39.00" stroke="#5b6472" stroke-width="1.0" stroke-linecap="round"/>
<rect x="132.00" y="24.00" width="32.00" height="34.00" rx="3" fill="#e7f0f7" stroke="#1f5f8b" stroke-width="1.0" opacity="1.0"/>
<text x="136.00" y="31.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.8" fill="#16181d" text-anchor="start" font-weight="bold">4. Emit profile</text>
<text x="136.00" y="39.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">JSON, versioned</text>
<text x="136.00" y="47.70" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">no scalar field</text>
<text x="136.00" y="55.90" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="6.8" fill="#5b6472" text-anchor="start" font-weight="normal">schema rejects one</text>
<line x1="63.00" y1="59.00" x2="63.00" y2="68.00" stroke="#8c2f2f" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
<line x1="63.00" y1="68.00" x2="148.00" y2="68.00" stroke="#8c2f2f" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,2"/>
<line x1="148.00" y1="68.00" x2="148.00" y2="59.00" stroke="#8c2f2f" stroke-width="1.0" stroke-linecap="round"/>
<line x1="148.00" y1="59.00" x2="150.00" y2="62.46" stroke="#8c2f2f" stroke-width="1.0" stroke-linecap="round"/>
<line x1="148.00" y1="59.00" x2="146.00" y2="62.46" stroke="#8c2f2f" stroke-width="1.0" stroke-linecap="round"/>
<text x="66.00" y="74.50" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="7.2" fill="#8c2f2f" text-anchor="start" font-weight="normal">gate fails -&gt; the measurement is void; the protocol reports the defect, not a result</text>
</svg>
